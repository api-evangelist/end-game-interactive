aid: end-game-interactive
name: End Game Interactive
description: 'End Game Interactive, Inc. (ENDGAME) is a Bellevue, Washington video game
  studio founded by Yang C. Liu and Luke Zbihlyj that builds free-to-play, cross-platform
  real-time multiplayer titles for browser, mobile and desktop — including ZombsRoyale.io,
  Zombs.io, Spinz.io, BOPZ.io, Fishington, Betrayal, Super Squad, Match City Puzzle and
  Fate Arena. The studio describes itself as technology-driven, running small agile teams
  against a proprietary "ENDGAME ENGINE" alongside Unity and Unreal, with AI-assisted
  pipelines for asset creation, animation, sound design and voicelines. It raised a $3M
  seed round in 2020 from Makers Fund, Supercell, Kevin Lin and Scooter Braun among others.
  ENDGAME is a consumer game publisher: as of this profile it operates no public developer
  program, no documented API, and no machine-readable contract on any of its web properties.'
